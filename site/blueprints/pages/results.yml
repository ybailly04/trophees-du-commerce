title: Résultats

options:
  changeTemplate: false

tabs:
  content:
    label: Contenu
    icon: text
    columns:
      main:
        width: 2/3
        sections:
          fields:
            type: fields
            fields:
              intro:
                label: Texte d'introduction
                type: writer
                marks:
                  - bold
                  - italic
                  - link
      sidebar:
        width: 1/3
        sections:
          sideContent:
            type: fields
            fields:
              limit:
                label: Nombre de lauréats par catégorie
                type: number
                min: 1
                default: 3

  seo:
    label: SEO
    icon: search
    fields:
      seoTitle:
        label: Titre SEO
        type: text
      seoDescription:
        label: Description SEO
        type: text
