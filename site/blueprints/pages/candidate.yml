title: Candidat

columns:
      main:
        width: 2/3
        sections:
          content:
            type: fields
            fields:
              title:
                label: Titre
                type: text
              adress:
                label: Adresse
                type: textarea
                buttons: false
              email:
                label: Email
                type: email
              phone:
                label: Téléphone
                type: tel
                placeholder: "04 XX XX XX XX"
              description:
                label: Description
                type: textarea
                size: medium
                maxlength: 600
              
      sidebar:
        width: 1/3
        sections:
          fields:
            type: fields
            fields:
              count:
                label: Votes
                type: number
                disabled: true
                default: 0
              image:
                label: Image d'illustration
                type: files
                multiple: false
                layout: cards
              categories:
                type: pages
                label: Catégories
                query: site.find('categories').children
                multiple: true 
                max: 5                  
                image:
                  ratio: 1/1
                  cover: true
                text: "{{ page.title }}"
              website:
                label: Lien vers site
                type: link
              instagram:
                label: Lien vers Instagram
                type: link
